<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Barlow";
          src: url("../assets/fonts/Barlow-700.ttf") format("truetype");
          font-weight: 700;
        }
        @font-face {
          font-family: "JB Mono";
          src: url("../assets/fonts/JetBrainsMono-400.woff2") format("woff2");
          font-weight: 400;
        }
        @font-face {
          font-family: "JB Mono";
          src: url("../assets/fonts/JetBrainsMono-700.woff2") format("woff2");
          font-weight: 700;
        }
        #b3-root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #111113;
        }
        #b3-cv {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
        }
      </style>
      <div id="b3-root" data-composition-id="b3-morph" data-width="1920" data-height="1080">
        <canvas id="b3-cv" width="1920" height="1080"></canvas>
      </div>
      <script>
        (function () {
          const W = 1920, H = 1080, CX = 960, CY = 540;
          const B = 60 / 128, DUR = 1.875;
          const INK = "#111113", RED = "#E9432F", COB = "#2E3DF2", YEL = "#F3C63B", PAPER = "#EEEAE3";
          const cv = document.getElementById("b3-cv");
          const ctx = cv.getContext("2d");
          const mk = () => { const c = document.createElement("canvas"); c.width = W; c.height = H; return c; };
          const acc = mk(), tmp = mk();
          const actx = acc.getContext("2d"), tctx = tmp.getContext("2d");

          const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
          const lerp = (a, b, u) => a + (b - a) * u;
          const prog = (t, a, d) => clamp((t - a) / d);
          const outExpo = (u) => (u >= 1 ? 1 : 1 - Math.pow(2, -10 * u));
          const inExpo = (u) => (u <= 0 ? 0 : Math.pow(2, 10 * (u - 1)));
          const outCubic = (u) => 1 - Math.pow(1 - u, 3);
          function spring(tau, f = 3.2, z = 0.8) {
            if (tau <= 0) return 0;
            const w = 2 * Math.PI * f, wd = w * Math.sqrt(1 - z * z);
            return 1 - Math.exp(-z * w * tau) * (Math.cos(wd * tau) + ((z * w) / wd) * Math.sin(wd * tau));
          }
          const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
          const mix = (a, b, u) => { const A = hex(a), Bc = hex(b); u = clamp(u); return "rgb(" + A.map((v, i) => Math.round(lerp(v, Bc[i], u))).join(",") + ")"; };

          // ---------- state as a pure function of time ----------
          const T1 = 0.03, T2 = B, T3 = 2 * B, TV1 = 3 * B, TV2 = 3 * B + B / 2, TD = 1.66;
          function state(t) {
            const p1 = spring(t - T1, 3.4, 0.8);
            const p2 = spring(t - T2, 2.8, 0.84);
            const p3 = spring(t - T3, 2.8, 0.84);
            const r2 = spring(t - T2, 2.2, 0.86), r3 = spring(t - T3, 2.2, 0.86);
            // card turns a quarter, then a half; content frames counter-rotate so it always reads upright
            const rot = 84 * r2 + 104 * r3;
            let phi = 0;
            // CTA (the button) in the card's local frame
            let cta = { x: 0, y: 0, w: lerp(32, 420, p1), h: lerp(32, 112, p1), rx: 0 };
            cta.rx = Math.min(cta.h / 2, lerp(16, 56, p1));
            const card = { w: 420, h: 112, rx: 56, a: 0, col: RED };
            if (t >= T2) {
              card.a = 1;
              phi = -90;
              card.w = lerp(420, 400, p2); card.h = lerp(112, 640, p2); card.rx = lerp(56, 18, clamp(p2));
              card.col = mix(RED, COB, prog(t, T2, 0.1));
              cta = { x: lerp(0, 126, p2), y: lerp(0, 175, p2), w: lerp(420, 56, p2), h: lerp(112, 210, p2) };
            }
            if (t >= T3) {
              phi = -180;
              card.w = lerp(400, 420, p3); card.h = lerp(640, 525, p3); card.rx = lerp(18, 14, clamp(p3));
              card.col = mix(COB, YEL, prog(t, T3 + 0.02, 0.05));
              cta = { x: lerp(126, 0, p3), y: lerp(175, -210, p3), w: lerp(56, 340, p3), h: lerp(210, 58, p3) };
            }
            cta.rx = Math.min(cta.w, cta.h) / 2;
            const pageIn = prog(t, T2 + 0.16, 0.12) * (1 - prog(t, T3, 0.06));
            const adIn = prog(t, T3 + 0.16, 0.12);
            const variant = t >= TV2 ? 3 : t >= TV1 ? 2 : 1;
            const name = t >= T3 ? "AD UNIT" : t >= T2 ? "LANDING PAGE" : "BUTTON";
            const spec = t >= T3 ? [lerp(1440, 1080, p3), lerp(900, 1350, p3)] : t >= T2 ? [lerp(320, 1440, p2), lerp(88, 900, p2)] : [320 * p1, 88 * p1];
            const dis = prog(t, TD, 0.12); // dissolve into dots
            const scat = inExpo(prog(t, 1.76, 0.115));
            return { p1, rot, phi, cta, card, pageIn, adIn, variant, name, spec, dis, scat, box: prog(t, 0.05, 0.22) * (1 - prog(t, TD, 0.08)) };
          }

          function rr(g, x, y, w, h, r) {
            g.beginPath();
            g.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2)));
          }

          function drawShape(g, s, t, ghost) {
            const { card, cta } = s;
            g.save();
            g.translate(CX, CY);
            g.rotate((s.rot * Math.PI) / 180);
            if (ghost) {
              const w = card.a ? card.w : cta.w, h = card.a ? card.h : cta.h, r = card.a ? card.rx : cta.rx;
              g.strokeStyle = ghost; g.lineWidth = 2;
              rr(g, -w / 2, -h / 2, w, h, r); g.stroke();
              g.restore();
              return;
            }
            const solid = 1 - s.dis;
            if (card.a && solid > 0) {
              g.globalAlpha = solid;
              g.fillStyle = card.col;
              rr(g, -card.w / 2, -card.h / 2, card.w, card.h, card.rx); g.fill();
              // landing page interior, drawn in its upright content frame (640 x 400)
              if (s.pageIn > 0) {
                g.save();
                g.rotate((-90 * Math.PI) / 180);
                const cw = 640, ch = 400, L = -cw / 2, T = -ch / 2;
                g.globalAlpha = solid * s.pageIn;
                g.fillStyle = PAPER;
                g.beginPath(); g.arc(L + 44, T + 38, 10, 0, Math.PI * 2); g.fill();
                for (let i = 0; i < 3; i++) { rr(g, cw / 2 - 210 + i * 58, T + 34, 40, 8, 4); g.fill(); }
                rr(g, L + 40, T + 104, 360, 36, 6); g.fill();
                rr(g, L + 40, T + 152, 280, 36, 6); g.fill();
                g.globalAlpha = solid * s.pageIn * 0.55;
                rr(g, L + 40, T + 210, 300, 12, 6); g.fill();
                rr(g, L + 40, T + 232, 220, 12, 6); g.fill();
                g.globalAlpha = solid * s.pageIn * 0.22;
                rr(g, cw / 2 - 210, T + 104, 170, 214, 12); g.fill();
                g.restore();
              }
              // ad interior (420 x 525), content frame is a half turn from the card frame
              if (s.adIn > 0) {
                g.save();
                g.rotate(Math.PI);
                g.globalAlpha = solid * s.adIn;
                const cw = 420, ch = 525, L = -cw / 2, T = -ch / 2;
                g.fillStyle = INK;
                rr(g, L + 22, T + 22, cw - 44, 268, 8); g.fill();
                const vx = [0, -70, 80, 10][s.variant], vy = [0, 20, -30, 10][s.variant], vr = [0, 62, 46, 78][s.variant];
                g.fillStyle = RED;
                g.beginPath(); g.arc(vx, T + 22 + 134 + vy, vr, 0, Math.PI * 2); g.fill();
                g.fillStyle = PAPER;
                rr(g, L + 44, T + 22 + 268 - 34, [0, 200, 150, 240][s.variant], 10, 5); g.fill();
                g.fillStyle = INK;
                rr(g, L + 30, T + 316, [0, 300, 250, 330][s.variant], 26, 5); g.fill();
                rr(g, L + 30, T + 352, [0, 210, 280, 190][s.variant], 26, 5); g.fill();
                g.restore();
              }
              g.globalAlpha = 1;
            }
            // the CTA, always red: it was the button
            if (solid > 0) {
              g.globalAlpha = solid;
              g.fillStyle = RED;
              rr(g, cta.x - cta.w / 2, cta.y - cta.h / 2, cta.w, cta.h, cta.rx); g.fill();
              const la = s.t < T2 ? prog(s.t, 0.16, 0.1) : s.t < T3 ? prog(s.t, T2 + 0.22, 0.1) : prog(s.t, T3 + 0.22, 0.1);
              const long = Math.max(cta.w, cta.h), short = Math.min(cta.w, cta.h);
              if (long > 120 && la > 0) {
                g.save();
                g.translate(cta.x, cta.y);
                g.rotate((s.phi * Math.PI) / 180);
                g.globalAlpha = solid * la;
                g.fillStyle = PAPER;
                const fs = Math.round(short * 0.3);
                g.font = "700 " + fs + "px Barlow";
                g.textAlign = "center"; g.textBaseline = "middle";
                if ("letterSpacing" in g) g.letterSpacing = Math.round(fs * 0.16) + "px";
                g.fillText(s.t >= T3 ? "SHOP NOW" : "BOOK A CALL", fs * 0.08, 1);
                if ("letterSpacing" in g) g.letterSpacing = "0px";
                g.restore();
              }
              g.globalAlpha = 1;
            }
            // halftone dissolve (ad frame: content coords are the card coords turned a half)
            if (s.dis > 0 && card.a) {
              const step = 26;
              const rad = 6.5 * outCubic(s.dis) * (1 - 0.3 * s.scat);
              const k = 1 + s.scat * 2.4;
              for (let y = -card.h / 2 + step / 2; y < card.h / 2; y += step) {
                for (let x = -card.w / 2 + step / 2; x < card.w / 2; x += step) {
                  const inCta = Math.abs(x - cta.x) < cta.w / 2 && Math.abs(y - cta.y) < cta.h / 2;
                  const cy = -y;
                  const inImg = cy < -card.h / 2 + 290 && cy > -card.h / 2 + 22 && Math.abs(x) < card.w / 2 - 22;
                  g.fillStyle = inCta ? RED : inImg ? "#3a3833" : YEL;
                  g.beginPath(); g.arc(x * k, y * k, rad, 0, Math.PI * 2); g.fill();
                }
              }
            }
            g.restore();
          }

          function drawBox(g, s, readOnly) {
            if (s.box <= 0) return;
            if (readOnly) return drawRead(g, s);
            const { card, cta } = s;
            const w = (card.a ? card.w : cta.w) + 28, h = (card.a ? card.h : cta.h) + 28;
            g.save();
            g.translate(CX, CY);
            g.rotate((s.rot * Math.PI) / 180);
            g.strokeStyle = "rgba(238,234,227," + (0.85 * s.box).toFixed(3) + ")";
            g.lineWidth = 1.5;
            // edges grow from the corners
            const e = outCubic(s.box);
            const cs = [[-w / 2, -h / 2, 1, 0], [w / 2, -h / 2, 0, 1], [w / 2, h / 2, -1, 0], [-w / 2, h / 2, 0, -1]];
            g.beginPath();
            for (let i = 0; i < 4; i++) {
              const [x, y, dx, dy] = cs[i];
              const len = (dx ? w : h) * e;
              g.moveTo(x, y); g.lineTo(x + dx * len, y + dy * len);
            }
            g.stroke();
            // handles
            const hs = 13 * e;
            const pts = [[-w / 2, -h / 2], [0, -h / 2], [w / 2, -h / 2], [w / 2, 0], [w / 2, h / 2], [0, h / 2], [-w / 2, h / 2], [-w / 2, 0]];
            for (const [x, y] of pts) {
              g.fillStyle = INK; g.fillRect(x - hs / 2, y - hs / 2, hs, hs);
              g.strokeRect(x - hs / 2, y - hs / 2, hs, hs);
            }
            // rotate handle
            g.beginPath(); g.moveTo(0, -h / 2); g.lineTo(0, -h / 2 - 34 * e); g.stroke();
            g.beginPath(); g.arc(0, -h / 2 - 40 * e, 6 * e, 0, Math.PI * 2); g.fillStyle = INK; g.fill(); g.stroke();
            // pivot crosshair (not over the button label)
            const pv = s.card.a ? 1 : 0;
            g.globalAlpha = pv;
            g.beginPath(); g.arc(0, 0, 11 * e, 0, Math.PI * 2); g.stroke();
            g.beginPath(); g.moveTo(-18 * e, 0); g.lineTo(18 * e, 0); g.moveTo(0, -18 * e); g.lineTo(0, 18 * e); g.stroke();
            g.globalAlpha = 1;
            g.restore();
          }
          function drawRead(g, s) {
            const { card, cta } = s;
            const w = (card.a ? card.w : cta.w) + 28, h = (card.a ? card.h : cta.h) + 28;
            // readouts, screen aligned, ride the box's upper right extent
            const a = (s.rot * Math.PI) / 180;
            const ex = (Math.abs(w * Math.cos(a)) + Math.abs(h * Math.sin(a))) / 2;
            const ey = (Math.abs(w * Math.sin(a)) + Math.abs(h * Math.cos(a))) / 2;
            const rx = CX + ex + 46, ry = CY - ey + 6;
            g.globalAlpha = s.box;
            g.textAlign = "left"; g.textBaseline = "top";
            if ("letterSpacing" in g) g.letterSpacing = "2px";
            g.font = "700 20px 'JB Mono'";
            g.fillStyle = PAPER;
            const rv = ((s.rot % 360) + 360) % 360;
            g.fillText("ROT " + rv.toFixed(1).padStart(5, "0") + "°", rx, ry);
            g.font = "400 18px 'JB Mono'";
            g.fillStyle = "rgba(238,234,227,0.62)";
            g.fillText(s.name, rx, ry + 32);
            g.fillText("W " + Math.round(s.spec[0]) + " · H " + Math.round(s.spec[1]), rx, ry + 58);
            if (s.t >= T3) {
              g.fillStyle = "rgba(238,234,227," + (0.62 * prog(s.t, T3 + 0.1, 0.1)).toFixed(3) + ")";
              g.fillText("VARIANT " + s.variant + "/12", rx, ry + 84);
            }
            if ("letterSpacing" in g) g.letterSpacing = "0px";
            g.globalAlpha = 1;
          }

          function draw(g, t) {
            g.clearRect(0, 0, W, H);
            const s = state(t);
            s.t = t;
            // echo outlines trail the spin
            if (s.card.a && s.dis < 0.5) {
              for (let i = 4; i >= 1; i--) {
                const sg = state(t - i * 0.028);
                sg.t = t - i * 0.028;
                const sp = Math.abs(s.rot - sg.rot);
                if (sp < 6) continue;
                const al = Math.min(1, sp / 40) * (0.3 - i * 0.055);
                const col = i % 2 ? "rgba(46,61,242," : "rgba(233,67,47,";
                drawShape(g, sg, sg.t, col + al.toFixed(3) + ")");
              }
            }
            drawShape(g, s, t);
            drawBox(g, s, false);
          }

          const N = 8, SHUT = 1 / 110;
          function render(t) {
            ctx.fillStyle = INK;
            ctx.fillRect(0, 0, W, H);
            actx.globalCompositeOperation = "source-over";
            actx.clearRect(0, 0, W, H);
            for (let i = 0; i < N; i++) {
              const ts = clamp(t + (i / (N - 1) - 0.5) * SHUT, 0, DUR - 0.0001);
              draw(tctx, ts);
              actx.globalCompositeOperation = "lighter";
              actx.globalAlpha = 1 / N;
              actx.drawImage(tmp, 0, 0);
            }
            actx.globalAlpha = 1;
            actx.globalCompositeOperation = "source-over";
            ctx.drawImage(acc, 0, 0);
            const s = state(t);
            s.t = t;
            drawBox(ctx, s, true);
          }

          const tl = gsap.timeline({ paused: true });
          const clock = { v: 0 };
          tl.to(clock, { v: 1, duration: DUR, ease: "none", onUpdate: () => render(tl.time()) }, 0);
          Promise.all([document.fonts.load("700 20px Barlow"), document.fonts.load("400 18px 'JB Mono'"), document.fonts.load("700 20px 'JB Mono'")]).then(() => {
            render(0);
            window.__timelines["b3-morph"] = tl;
          });
        })();
      </script>
    </template>
  </body>
</html>
